name: Build UIScroller (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot rsync curl perl git ca-certificates \
            xz-utils unzip build-essential libxml2 libtinfo6
          # The prebuilt iOS toolchain is built against libtinfo.so.5/6;
          # symlink so it resolves regardless of the exact minor version.
          sudo ln -sf "$(find /usr/lib/x86_64-linux-gnu -name 'libtinfo.so.6*' | head -1)" \
                       /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS toolchain (Linux, Mach-O capable clang + ld)
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | sudo tar -xJvf - -C "$THEOS/toolchain/"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Download iOS 16.5 SDK (patched, includes private frameworks)
        run: |
          mkdir -p "$THEOS/sdks"
          curl -sL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            | tar -xJvf - -C "$THEOS/sdks/"
          ls -d "$THEOS/sdks"/*.sdk

      - name: Provide ldid shim (no-op signing; unsigned tweak dylib is fine for sideload)
        run: |
          printf '#!/bin/sh\n# no-op ldid shim for CI builds (unsigned tweak dylib)\nexit 0\n' | sudo tee /usr/local/bin/ldid >/dev/null
          sudo chmod +x /usr/local/bin/ldid
          command -v ldid

      - name: Build package (roothide)
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee build.log

      - name: Publish build log (debug)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan ci-debug
            git rm -rf --cached . >/dev/null 2>&1
            git add build.log
            git commit -m "CI debug: build log"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-debug
          fi

      - name: Publish deb to ci-artifacts-roothide
        run: |
          DEB=$(find . -name '*.deb' -not -path './theos/*' -not -path './.git/*' | head -1)
          echo "Built deb: $DEB"
          test -n "$DEB" || { echo "ERROR: no deb produced"; exit 1; }
          cp "$DEB" UIScroller_1.0.6_roothide.deb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-artifacts-roothide
          git rm -rf --cached . >/dev/null 2>&1
          git add UIScroller_1.0.6_roothide.deb
          git commit -m "CI: UIScroller 1.0.6 roothide build"
          git push --force origin ci-artifacts-roothide

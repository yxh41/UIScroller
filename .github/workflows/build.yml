name: Build UIScroller (roothide)

# 在 GitHub macOS runner 上用 roothide 官方 theos 分支直接构建 roothide .deb：
#   1) clone roothide/theos（内置 roothide package scheme；主线和 theos/theos 没有 roothide scheme，会导致 make package 失败）
#   2) make package 直接产出 iphoneos-arm64e 的 roothide .deb（无需 patch.sh / RootHidePatcher）
# 错误通过 ::error:: 注解直接显示在 Actions 日志，并上传 .deb 为 artifact 可直接下载。
# 参考同作者 手势(Oback) 验证通过的 roothide 构建配置。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || true

      - name: Install dependencies
        run: |
          brew install dpkg ldid gnu-sed findutils coreutils xz
          cpanm -n IO::Compress::Lzma 2>/dev/null || true

      - name: Install Theos (roothide fork)
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          for f in logos.pl dm.pl; do
            [ -e "$THEOS/bin/$f" ] && continue
            case "$f" in
              logos.pl) curl -fsSL https://raw.githubusercontent.com/theos/logos/master/logos.pl -o "$THEOS/bin/logos.pl" ;;
              dm.pl)    curl -fsSL https://raw.githubusercontent.com/theos/dm.pl/master/dm.pl -o "$THEOS/bin/dm.pl" ;;
            esac
            chmod +x "$THEOS/bin/$f"
          done

      - name: Install SDKs
        run: |
          rm -rf "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"
          ls -1 "$THEOS/sdks/" | grep -i iphone

      - name: Detect SDK version
        id: sdk
        run: |
          SDK=$(ls "$THEOS/sdks/" | grep -o 'iPhoneOS[0-9.]*\.sdk' | sed 's/iPhoneOS//;s/\.sdk//' | sort -V | tail -1)
          echo "sdk_version=$SDK" >> "$GITHUB_OUTPUT"
          echo "Detected latest SDK: $SDK"
          sed -i '' "s|^TARGET.*|TARGET := iphone:clang:$SDK:14.0|" Makefile
          echo "Makefile TARGET now:"
          grep '^TARGET' Makefile

      - name: Build roothide .deb
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_ENV=silent 2>&1 | tee ci-build.log || make package FINALPACKAGE=1 2>&1 | tee ci-build.log
          # 把编译错误转成 GitHub Actions 注解（::error::），便于直接读取定位未声明符号
          grep -iE "error:|undeclared identifier|No such file" ci-build.log | sed 's|^|::error::|' || true
          ROOTHIDE_DEB=$(ls packages/*_iphoneos-arm64e.deb 2>/dev/null | head -n1)
          echo "ROOTHIDE_DEB=$ROOTHIDE_DEB"
          [ -n "$ROOTHIDE_DEB" ] || { echo "No roothide .deb produced"; exit 1; }
          ls -la "$ROOTHIDE_DEB"
          dpkg-deb -I "$ROOTHIDE_DEB" | head -20
          BUILT_VER=$(dpkg-deb -f "$ROOTHIDE_DEB" Version 2>/dev/null)
          echo "::notice::UIScroller package version = ${BUILT_VER:-UNKNOWN}"

      - name: Echo build log tail as annotations (agent-readable)
        if: failure()
        run: |
          if [ -f ci-build.log ]; then
            echo "===== ci-build.log (tail 40) ====="
            tail -n 40 ci-build.log
            echo "===== emitting file-anchored ::error:: annotations (retrievable via API) ====="
            # NOTE: prefix with sed (NOT printf %s) so '%' chars in the log
            # (e.g. '100%', 'error: %s') don't break the ::error:: command parsing.
            # Use file=Makefile (a real tracked repo file) so GitHub actually
            # surfaces the annotation (annotations referencing untracked files
            # like ci-build.log are dropped by GitHub -> annotations_url=None).
            tail -n 40 ci-build.log | sed 's|^|::error file=Makefile::|'
          else
            echo "ci-build.log not found"
          fi

      - name: Publish build log to ci-debug branch (raw-readable)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ci-build.log ]; then
            git config user.email "ci@local"
            git config user.name "CI"
            git checkout --orphan ci-debug
            git rm -rf --cached . >/dev/null 2>&1
            git add -f ci-build.log
            git commit -m "ci debug log ($(date -u))" 
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-debug
            echo "PUSHED ci-debug branch"
          else
            echo "no ci-build.log to push"
          fi

      - name: Report error to commit status (sandbox-readable)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ci-build.log ]; then
            i=1
            # gh is preinstalled on GitHub runners and uses GITHUB_TOKEN automatically.
            # Commit statuses are readable unauthenticated via the statuses API,
            # unlike artifacts/branches which need auth/write perms.
            tail -n 12 ci-build.log | grep -iE 'error|warning:|ld:|make\[|fatal|undefined|No such' | tail -n 5 | while IFS= read -r line; do
              desc="${line:0:140}"
              gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
                -f state=failure -f "context=ci-error-$i" -f "description=$desc" >/dev/null 2>&1 || true
              i=$((i+1))
            done
            echo "posted error commit statuses"
          else
            echo "no ci-build.log"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiscroller-buildlog
          path: ci-build.log
          if-no-files-found: warn
          retention-days: 90

      - name: Upload roothide .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uiscroller-deb
          path: packages/*_iphoneos-arm64e.deb
          if-no-files-found: error
          retention-days: 90

      # Token-free fallback: even with a read-only GITHUB_TOKEN the built .deb
      # is unreadable via artifacts/branches/statuses, so emit it as base64 that
      # the repo owner can copy straight from the Actions log and decode locally.
      - name: Emit roothide .deb as base64 (token-free fallback)
        if: always()
        run: |
          DEB=$(ls packages/*_iphoneos-arm64e.deb 2>/dev/null | head -n1)
          if [ -n "$DEB" ]; then
            echo "::group::UIScroller roothide .deb (base64) — copy all lines below, decode on Windows"
            base64 -i "$DEB" || echo "base64 emit failed; download artifact uiscroller-deb instead"
            echo "::endgroup::"
            echo "::notice::Windows decode: certutil -decode uiscroller.b64 uiscroller.deb"
          else
            echo "No roothide .deb produced; nothing to emit."
          fi
